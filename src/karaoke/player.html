<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>Saturday Night Karaoke · Jukebox</title>
<style>html, body { margin: 0; height: 100%; background: #000; overflow: hidden; } #ytMount, iframe { display: block; border: 0; width: 100%; height: 100%; }</style>
</head>
<body>
<div id="ytMount"></div>
<script>
// The jukebox. Runs on GitHub Pages so YouTube sees a real website origin.
// Uses the official YouTube IFrame API with rAF edge-triggered getCurrentTime() detection while playing
// (emitting edge: true the exact frame the quantized clock ticks forward, plus 250ms heartbeats for stall detection);
// falls back automatically to a plain iframe message relay if the API script stalls.
(function () {
  "use strict";
  var hash = location.hash || "";
  var m = /[#&]v=([A-Za-z0-9_\-]{11})(?:&|$)/.exec(hash);
  if (!m || window.parent === window) return;
  var vid = m[1], here = location.href.split("#")[0];
  var wantMute = /[#&]mute=1(?:&|$)/.test(hash);
  var wantLoop = /[#&]loop=1(?:&|$)/.test(hash);
  var mode = "init", player = null, fallbackFrame = null, rafId = null, hbTimer = null, pendingCmds = [];
  var lastState = null, lastT = NaN, lastSentAt = 0;

  function toTV(obj) {
    try { window.parent.postMessage(typeof obj === "string" ? obj : JSON.stringify(obj), "*"); } catch (x) {}
  }

  function runCmd(func, args) {
    if (mode === "api" && player) {
      try {
        if (func === "playVideo") player.playVideo();
        else if (func === "pauseVideo") player.pauseVideo();
        else if (func === "seekTo" && args && args.length) player.seekTo(args[0], args[1] !== false);
        else if (func === "setVolume" && args && args.length) player.setVolume(args[0]);
        else if (func === "mute" && player.mute) player.mute();
        else if (func === "unMute" && player.unMute) player.unMute();
        else if (func === "unloadModule" && player.unloadModule && args && args.length) player.unloadModule(args[0]);
        else if (func === "setOption" && player.setOption && args && args.length >= 3) player.setOption(args[0], args[1], args[2]);
      } catch (x) {}
    } else if (mode === "raw" && fallbackFrame && fallbackFrame.contentWindow) {
      try { fallbackFrame.contentWindow.postMessage(JSON.stringify({ event: "command", func: func, args: args || [] }), "https://www.youtube-nocookie.com"); } catch (x) {}
    } else {
      pendingCmds.push([func, args || []]);
    }
  }

  function flushCmds() {
    while (pendingCmds.length) { var c = pendingCmds.shift(); runCmd(c[0], c[1]); }
  }

  function emitTick(forceEdge) {
    if (mode !== "api" || !player || typeof player.getCurrentTime !== "function") return;
    try {
      var st = typeof player.getPlayerState === "function" ? player.getPlayerState() : -1;
      var t = player.getCurrentTime();
      var dur = typeof player.getDuration === "function" ? player.getDuration() : 0;
      if (typeof t !== "number" || isNaN(t)) return;
      var changed = isNaN(lastT) || Math.abs(t - lastT) >= 0.002;
      var stateChanged = st !== lastState;
      var now = Date.now();
      if (changed || stateChanged || forceEdge) {
        lastState = st; lastT = t; lastSentAt = now;
        toTV({ event: "snk-tick", t: t, dur: dur || 0, state: st, wall: now, edge: changed || !!forceEdge });
      } else if (st === 1 && now - lastSentAt >= 250) {
        lastSentAt = now;
        toTV({ event: "snk-tick", t: t, dur: dur || 0, state: st, wall: now, edge: false });
      }
    } catch (x) {}
  }

  function startPoll() {
    if (rafId) cancelAnimationFrame(rafId);
    clearInterval(hbTimer);
    function frame() {
      if (mode !== "api") return;
      if (lastState === 1) emitTick(false);
      rafId = requestAnimationFrame(frame);
    }
    rafId = requestAnimationFrame(frame);
    // Heartbeat fallback when tab/rAF is throttled or player is paused/buffering
    hbTimer = setInterval(function () { emitTick(false); }, 150);
  }

  function startFallback() {
    if (mode !== "init") return;
    mode = "raw";
    var mount = document.getElementById("ytMount");
    mount.innerHTML = "";
    var f = document.createElement("iframe");
    f.setAttribute("allow", "autoplay; encrypted-media");
    f.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
    f.setAttribute("title", "Music");
    f.src = "https://www.youtube-nocookie.com/embed/" + vid + "?autoplay=1&controls=0&disablekb=1&fs=0&rel=0&modestbranding=1&playsinline=1&iv_load_policy=3&enablejsapi=1" +
      (wantMute ? "&mute=1" : "") + (wantLoop ? "&loop=1&playlist=" + vid : "") +
      "&origin=" + encodeURIComponent(location.origin) + "&widget_referrer=" + encodeURIComponent(here);
    f.addEventListener("load", function () {
      try { f.contentWindow.postMessage(JSON.stringify({ event: "listening", id: 1, channel: "widget" }), "https://www.youtube-nocookie.com"); } catch (x) {}
      flushCmds();
    });
    mount.appendChild(f);
    fallbackFrame = f;
    toTV({ event: "snk-wrap-ready", api: false });
  }

  window.addEventListener("message", function (e) {
    if (e.source === window.parent) {
      var d = e.data;
      try { d = typeof d === "string" ? JSON.parse(d) : d; } catch (x) { d = null; }
      if (mode === "raw" && fallbackFrame && fallbackFrame.contentWindow) {
        try { fallbackFrame.contentWindow.postMessage(e.data, "https://www.youtube-nocookie.com"); } catch (x) {}
      } else if (d && d.event === "command" && d.func) {
        runCmd(d.func, d.args);
      }
    } else if (mode === "raw" && fallbackFrame && e.source === fallbackFrame.contentWindow) {
      toTV(e.data);
    }
  });

  var apiGuard = setTimeout(startFallback, 4500);
  window.onYouTubeIframeAPIReady = function () {
    if (mode !== "init") return;
    clearTimeout(apiGuard);
    try {
      mode = "api";
      var pVars = {
        autoplay: 1, controls: 0, disablekb: 1, fs: 0, rel: 0,
        modestbranding: 1, playsinline: 1, iv_load_policy: 3,
        origin: location.origin, widget_referrer: here
      };
      if (wantMute) pVars.mute = 1;
      if (wantLoop) { pVars.loop = 1; pVars.playlist = vid; }
      player = new YT.Player("ytMount", {
        host: "https://www.youtube-nocookie.com",
        videoId: vid,
        playerVars: pVars,
        events: {
          onReady: function () {
            toTV({ event: "snk-wrap-ready", api: true });
            toTV({ event: "onReady" });
            if (wantMute) { try { player.mute(); } catch (x) {} }
            flushCmds();
            try { player.playVideo(); } catch (x) {}
            startPoll();
          },
          onStateChange: function (ev) {
            var st = ev && typeof ev.data === "number" ? ev.data : -1;
            var t = 0, dur = 0;
            try { t = player.getCurrentTime() || 0; dur = player.getDuration() || 0; } catch (x) {}
            var now = Date.now();
            lastState = st; lastT = t; lastSentAt = now;
            toTV({ event: "snk-tick", t: t, dur: dur, state: st, wall: now, edge: true });
            toTV({ event: "onStateChange", info: st });
          },
          onError: function (ev) {
            toTV({ event: "onError", info: ev ? ev.data : "err" });
          }
        }
      });
      toTV({ event: "snk-wrap-ready", api: true });
    } catch (x) {
      mode = "init";
      startFallback();
    }
  };

  var tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  tag.onerror = startFallback;
  document.head.appendChild(tag);
})();
</script>
</body>
</html>
