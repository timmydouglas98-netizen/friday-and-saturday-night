<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Friday &amp; Saturday Night — The Strip</title>
<style id="fsn-fonts">
/* @@SHARED_FONTS@@ */
</style>
<style>
:root {
  --ink: #2a1c18; --cream: #fff3d6; --paper: #fbf4e4; --red: #c8352b; --navy: #1e3d93;
  --gold: #f0b93a; --pink: #ff5fa2; --teal: #62e8de;
  --f-toon: "Caprasimo", "Cooper Black", "Bookman Old Style", Georgia, serif;
  --f-ui: "Oswald", "Arial Narrow", Arial, sans-serif;
  --f-osd: "VT323", "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0c0a18; overflow: hidden; font-family: var(--f-ui); -webkit-user-select: none; user-select: none; }
#stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: #141942; }
#zoom { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; }
.z-layer { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transition: transform .75s cubic-bezier(.5,0,.75,.25); will-change: transform; }
.z-fg { pointer-events: none; }
#stage.enter-video .z-layer { transform-origin: 31% 62%; }
#stage.enter-karaoke .z-layer { transform-origin: 77% 62%; }
#stage.enter-video .z-sky, #stage.enter-karaoke .z-sky { transform: scale(1.35); }
#stage.enter-video .z-mid, #stage.enter-karaoke .z-mid { transform: scale(2.45); }
#stage.enter-video .z-fg, #stage.enter-karaoke .z-fg { transform: scale(2.85); }
.weave { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; animation: weave 2s steps(1) infinite; }
.weave canvas, .weave svg { position: absolute; top: 0; left: 0; display: block; width: 1920px; height: 1080px; }
@keyframes weave { 0% { transform: translate(-.35px,-.4px); } 17% { transform: translate(.35px,-.25px); } 33% { transform: translate(.4px,.3px); } 50% { transform: translate(-.4px,.2px); } 67% { transform: translate(.5px,-.3px); } 83% { transform: translate(-.25px,-.1px); } }
#oSky { width: 1920px; height: 1080px; }
.pan { position: absolute; top: 0; left: 0; width: 3840px; height: 640px; animation: cloudPan 760s linear infinite; }
.pan canvas { position: absolute; top: 0; left: 0; width: 1920px !important; height: 640px !important; }
.pan #oCloudB { left: 1920px; }
@keyframes cloudPan { from { transform: translate3d(0,0,0); } to { transform: translate3d(-1920px,0,0); } }
.rain { position: absolute; left: -25%; right: -25%; top: -25%; bottom: -25%; transform: rotate(9deg); pointer-events: none; }
.rain i { position: absolute; left: 0; right: 0; bottom: 0; display: block; background-repeat: repeat; }
.rain.near i { top: -320px; background-size: 320px 320px; animation: fallNear .35s steps(4) infinite; }
.rain.far i { top: -220px; background-size: 220px 220px; animation: fallFar .52s steps(6) infinite; opacity: .55; }
@keyframes fallNear { from { transform: translate3d(0,0,0); } to { transform: translate3d(0,320px,0); } }
@keyframes fallFar { from { transform: translate3d(0,0,0); } to { transform: translate3d(0,220px,0); } }
.grain { position: absolute; top: -128px; left: -128px; right: -128px; bottom: -128px; pointer-events: none; opacity: .14; background-size: 256px 256px; animation: grain .5s steps(1) infinite; z-index: 40; }
@keyframes grain { 0% { transform: translate(0,0); } 17% { transform: translate(-61px,37px); } 33% { transform: translate(43px,-89px); } 50% { transform: translate(-97px,-21px); } 67% { transform: translate(23px,71px); } 83% { transform: translate(79px,-49px); } }
.vig { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 41; background: radial-gradient(ellipse 78% 72% at 50% 48%, rgba(0,0,0,0) 60%, rgba(16,8,28,.45) 100%); }
#fade { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #0c0a18; pointer-events: none; opacity: 1; transition: opacity .45s; z-index: 60; }
#fade.off { opacity: 0; }

/* Animated cels */
.n-flick { animation: nflick 9s steps(1) infinite; }
@keyframes nflick { 0%, 90% { opacity: 1; } 91% { opacity: .3; } 92% { opacity: 1; } 94% { opacity: .5; } 95%, 100% { opacity: 1; } }
.n-buzz { animation: nbuzz 5.3s steps(1) infinite; }
@keyframes nbuzz { 0%, 70% { opacity: 1; } 71% { opacity: .5; } 73% { opacity: .95; } 74% { opacity: .6; } 77%, 100% { opacity: 1; } }
.disco { animation: disco 2.4s steps(1) infinite; }
@keyframes disco { 0% { fill: #ff7ab0; opacity: .22; } 25% { fill: #62e8de; opacity: .16; } 50% { fill: #ffc857; opacity: .24; } 75% { fill: #b48cff; opacity: .18; } }
#vDoor, #kDoor { transition: transform .42s steps(5); transform-box: fill-box; transform-origin: 0 50%; }
#stage.open-video #vDoor { transform: scaleX(.12); }
#stage.open-karaoke #kDoor { transform: scaleX(.12); }

/* Interactive storefront plaques */
.clock { position: absolute; top: 34px; right: 54px; z-index: 20; font-family: var(--f-ui); font-weight: 600; font-size: 32px; letter-spacing: .06em; color: var(--cream);
  text-shadow: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 2px 4px 0 var(--ink); }
/* the selected shop is lit (door glow, the other shop in shadow); one caption sits below the kerb */
.shade { opacity: 0; transition: opacity .4s ease; }
.shade.on { opacity: .55; }
.dglow { opacity: 0; transition: opacity .4s ease; }
.dglow.on { opacity: 1; }
.dry .rain { display: none; }
.hit { position: absolute; top: 120px; height: 700px; z-index: 22; cursor: pointer; }
/* the shop names itself on its fascia; the caption only says what's waiting inside */
#caption { position: absolute; left: 0; right: 0; bottom: 104px; z-index: 25; text-align: center; pointer-events: none; }
#caption .slip { display: inline-block; max-width: 1200px; padding: 12px 30px 14px; background: var(--paper); color: var(--ink); border: 4px solid var(--ink); border-radius: 10px;
  box-shadow: 8px 10px 0 rgba(10,4,18,.55); pointer-events: auto; cursor: pointer; }
#caption p { margin: 0; font-size: 30px; color: #3d3127; line-height: 1.3; }
html.calm .weave, html.calm .grain, html.calm .pan, html.calm .rain, html.calm .rain i, html.calm .n-flick, html.calm .n-buzz, html.calm .disco { animation-play-state: paused; }
.hint { position: absolute; left: 0; right: 0; bottom: 26px; text-align: center; z-index: 25; font-size: 27px; font-weight: 500; letter-spacing: .04em;
  color: var(--cream); text-shadow: 2px 2px 0 var(--ink), 0 0 12px rgba(10,4,14,.9); }
#toast { position: absolute; left: 50%; top: 44px; transform: translateX(-50%); padding: 14px 30px; background: var(--paper); color: var(--ink);
  border: 4px solid var(--ink); border-radius: 12px; box-shadow: 6px 8px 0 rgba(10,4,18,.55); font-family: var(--f-toon); font-size: 32px; z-index: 50; }
#toast[hidden] { display: none; }
</style>
<body>
<div id="stage" data-fsn="fsn-street">
  <div id="zoom">
    <div class="z-layer z-sky">
      <div class="weave">
        <canvas id="oSky" width="960" height="540"></canvas>
        <div class="pan"><canvas id="oCloudA" width="1920" height="640"></canvas><canvas id="oCloudB" width="1920" height="640"></canvas></div>
      </div>
    </div>
    <div class="z-layer z-mid">
      <div class="weave">
        <canvas id="oPlate" width="1920" height="1080"></canvas>
        <svg id="oCels" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Friday Night Video and Saturday Night Karaoke side by side on the strip"></svg>
      </div>
    </div>
    <div class="z-layer z-fg">
      <div class="rain far"><i></i></div>
      <div class="rain near"><i></i></div>
    </div>
  </div>
  <div class="clock" id="oClock"></div>
  <div class="hit" id="hitVideo" style="left:0;width:960px"></div>
  <div class="hit" id="hitKaraoke" style="left:960px;width:960px"></div>
  <div id="caption"><div class="slip"><p id="cSub"></p></div></div>
  <div class="hint" id="hint"></div>
  <div id="toast" hidden></div>
  <div class="grain" id="grain"></div>
  <div class="vig"></div>
  <div id="fade"></div>
</div>
<script>

  };

  // The Strip is the same block you see from each shop's own doorstep: the video store under its shingled mansard with

    o += R(1590, 574, 240, 128, "#3a2a22") + R(1598, 582, 224, 112, "#f7e9c8");

    o += R(-10, 812, 1940, 280, "url(#rd)");

      smear(1320, 814, 420, 230, NEON.pink, .3 * k, r) + smear(1520, 814, 340, 210, NEON.teal, .24 * k, r);
    return '<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">' + o + "</svg>";
  }

  function buildCelsSVG(P) {

      '<linearGradient id="shL" x1="0" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">' +

        '<stop offset="1" stop-color="#0a0818" stop-opacity="0"/>' +
      "</linearGradient>" +
      '<linearGradient id="shR" x1="800" y1="0" x2="1920" y2="0" gradientUnits="userSpaceOnUse">' +
        '<stop offset="0" stop-color="#0a0818" stop-opacity="0"/>' +
        '<stop offset=".16" stop-color="#0a0818" stop-opacity=".35"/>' +
        '<stop offset=".38" stop-color="#0a0818" stop-opacity=".82"/>' +
        '<stop offset="1" stop-color="#0a0818" stop-opacity=".95"/>' +
      "</linearGradient>" +
      '<radialGradient id="rgV">' +
        '<stop offset="0" stop-color="#fff2c8" stop-opacity=".46"/>' +

    g += '<text x="1262" y="430" text-anchor="middle" font-family="' + YT + '" font-size="' + fs + '" fill="' + letter + '" stroke="' + rim + '" stroke-width="3" paint-order="stroke">' + esc(videoName) + "</text>";

      '<text x="1430" y="541" text-anchor="middle" font-family="' + YT + '" font-size="25" fill="#ffd3e2" stroke="#ff2d6f" stroke-width="2.2" paint-order="stroke" letter-spacing="1">OPEN</text></g>';
    var gl = P.night ? "#4b5690" : cmix(P.sky[2][1], "#ffffff", .1), fr = Lc(P, OB.bronze);
    g += '<g id="vDoor">' + R(1258, 570, 88, 122, gl, op(".14")) + '<rect x="1261" y="573" width="82" height="116" fill="none" stroke="' + fr + '" stroke-width="7"/>' +
      '<rect x="1257.5" y="569.5" width="89" height="123" fill="none"' + ink(2) + "/>" + R(1264, 626, 76, 7, Lc(P, "#c9c6c0")) +
      '<rect x="1272" y="584" width="60" height="16" rx="3" fill="#ffd84d"' + ink(1) + "/>" + "</g>";
    o += g + "</g>";
    // the pole sign's faces
    var fn = splitName(videoName);
    if (lit) o += halo(156, 205, 190, 130, "#fff0c8", .45);
    o += '<rect x="46" y="118" width="220" height="174" rx="8" fill="#fff3cf"' + ink(3) + "/>" + R(46, 118, 220, 30, "#c8352b", ink(3));
    o += Tx(156, 139, 14, "MOVIES · TV · LATE NIGHT", "#fff3d6", ' font-weight="600" letter-spacing="2"', OSW);
    if (fn[0]) o += Tx(156, 190, fitSize(fn[0].toUpperCase(), 196, 30, .62), esc(fn[0].toUpperCase()), "#1e3d93", ' font-weight="600" letter-spacing="1"', OSW);
    o += Tx(156, fn[0] ? 262 : 240, fitSize(fn[1], 196, fn[0] ? 66 : 80, .7), esc(fn[1].toUpperCase()), "#d2263a", ' stroke="#2a1c18" stroke-width="2"');
    o += '<rect x="60" y="322" width="192" height="66" fill="#f4ead2"' + ink(2.5) + "/>";
    o += Tx(156, 350, 18, "OPEN TIL MIDNIGHT", "#1b1b22", ' font-weight="600" letter-spacing="2"', OSW) + Tx(156, 377, 18, "KARAOKE NEXT DOOR", "#c8352b", ' font-weight="600" letter-spacing="2"', OSW);
    // the bar's neon
    var bn = splitName(barName);
    if (bn[0]) {
      o += '<g class="n-buzz">' + neonText(1430, 404, fitSize(bn[0], 680, 54, .54), bn[0], NEON.pink) + "</g>";
      var up = bn[1].toUpperCase();
      o += '<g class="n-flick">' + neonText(1430, 466, fitSize(up, 640, 58, .76), up, NEON.teal, OSW, ' font-weight="600" letter-spacing="9"') + "</g>";
    } else {
      o += '<g class="n-flick">' + neonText(1430, 444, fitSize(bn[1], 680, 88, .58), bn[1], NEON.pink) + "</g>";
    }
    [[1100, 1], [1168, .88], [1290, 1.05], [1330, .9]].forEach(function (h) { o += Ci(h[0], 652, 12 * h[1], "#2a1622", op(".85")) + Pt("M" + (h[0] - 30 * h[1]) + ",694 Q" + h[0] + ",662 " + (h[0] + 30 * h[1]) + ",694 Z", "#2a1622", op(".85")); });
    o += '<rect class="disco" x="1044" y="582" width="324" height="112"/>';
    o += '<g id="kDoor"><rect x="1428" y="556" width="112" height="204" fill="#1f5a5c"' + ink(3) + "/>" + Ci(1484, 624, 24, "#ffcf7a", ink(3)) + R(1442, 676, 8, 28, "#d9a441", ink(1.5)) + "</g>";
    o += Tx(1710, 622, 26, "TONIGHT", "#a8323e") + Tx(1710, 650, 22, "OPEN MIC", "#1b1b22", ' font-weight="600" letter-spacing="2"', OSW) + Tx(1710, 676, 15, "ALL VOICES WELCOME", "#5f5a4e", ' font-weight="500"', OSW);
    // the streetlight
    if (lit) o += halo(1814, 214, 120, 70, "#ffe2a6", .5 * P.warm) + Pg([1792, 212, 1836, 212, 1900, 800, 1720, 800], "#ffe2a6", op((.07 * P.warm).toFixed(3)));
    o += El(1814, 211, 22, 5, lit ? "#fff3cf" : "#c9c4b8");
    // which shop you're at: soft dusk gradient wash dims the other side, and warm radial door-light halos spill out
    o += '<g class="shade" id="shadeVideo">' + R(0, 0, 1120, 1080, "url(#shL)") + "</g>";
    o += '<g class="shade" id="shadeKaraoke">' + R(800, 0, 1120, 1080, "url(#shR)") + "</g>";
    // soft radial door-light halos spilling onto the footpath
    var dx0 = vx(1258), dx1 = vx(1346), dyt = vy(570), dcx = (dx0 + dx1) / 2;
    o += '<g class="dglow" id="glowVideo">' + El(dcx, 736, 260, 175, "url(#rgV)") + El(dcx, 804, 240, 44, "url(#rgV)") + R(dx0, dyt, dx1 - dx0, 760 - dyt, "#fff2c8", op(".16")) + "</g>";
    o += '<g class="dglow" id="glowKaraoke">' + El(1484, 710, 290, 195, "url(#rgK)") + El(1484, 804, 270, 46, "url(#rgK)") + R(1428, 556, 112, 204, "#ffd9b0", op(".14")) + "</g>";
    return o;
  }

  // The scene is drawn at 1920×1080 and scaled to the screen. The TV can settle on its real size a moment after the page
  // has measured it (and not say so), which left the room zoomed in and cropped; so the size is checked again until
  // it settles, and whenever the page comes back into view.
  var fitW = 0, fitH = 0;
  function fit() {
    var de = document.documentElement, vv = window.visualViewport;
    var w = Math.min(window.innerWidth || 1920, de.clientWidth || 1e6, vv && vv.width ? vv.width : 1e6);
    var h = Math.min(window.innerHeight || 1080, de.clientHeight || 1e6, vv && vv.height ? vv.height : 1e6);
    if (w === fitW && h === fitH) return;
    fitW = w; fitH = h;
    var s = Math.min(w / 1920, h / 1080);
    $("stage").style.transform = "translate(" + ((w - 1920 * s) / 2).toFixed(1) + "px," + ((h - 1080 * s) / 2).toFixed(1) + "px) scale(" + s.toFixed(5) + ")";
  }
  [100, 400, 1000, 2500, 5000, 10000].forEach(function (ms) { setTimeout(fit, ms); });
  window.addEventListener("load", fit);
  window.addEventListener("pageshow", fit);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) fit(); });
  function updateClock() { $("oClock").textContent = UI.clock(); }

  var sel = (function () {
    try { var v = localStorage.getItem("fsn-last-venue"); if (v === "video" || v === "karaoke") return v; } catch (e) {}
    return new Date().getDay() === 6 ? "karaoke" : "video";
  })();
  var entering = false, backArmed = 0, toastT = null;
  function showToast(txt) {
    var el = $("toast"); el.textContent = txt; el.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(function () { el.hidden = true; }, 2800);
  }
  function renderSel() {
    var s = SHOPS[sel], cap = $("caption");
    $("cSub").textContent = s.s;
    cap.className = sel;
    function tog(id, on) { var el = document.getElementById(id); if (el) el.setAttribute("class", el.getAttribute("class").replace(/\s*\bon\b/g, "") + (on ? " on" : "")); }
    tog("shadeVideo", sel !== "video"); tog("shadeKaraoke", sel !== "karaoke");
    tog("glowVideo", sel === "video"); tog("glowKaraoke", sel === "karaoke");
  }
  function enter(venue) {
    if (entering) return;
    entering = true; sel = venue; renderSel();
    var st = $("stage");
    st.classList.add("open-" + venue);
    setTimeout(function () { st.classList.add("enter-" + venue); }, 280);
    setTimeout(function () { $("fade").classList.remove("off"); }, 540);
    setTimeout(function () { FSN.go(venue); }, 900);
  }

  document.addEventListener("keydown", function (e) {
    var k = e.keyCode;
    if (entering) return;
    if (k === 37) { sel = "video"; renderSel(); e.preventDefault(); }
    else if (k === 39) { sel = "karaoke"; renderSel(); e.preventDefault(); }
    else if (k === 13) { enter(sel); e.preventDefault(); }
    else if (k === 10009 || k === 27) {
      if (Date.now() - backArmed < 3000) { try { tizen.application.getCurrentApplication().exit(); } catch (x) {} }
      else { backArmed = Date.now(); showToast("Press Back again to exit"); }
      e.preventDefault();
    }
  });
  function pickOrEnter(v) { if (entering) return; if (sel === v) enter(v); else { sel = v; renderSel(); } }
  $("hitVideo").addEventListener("click", function () { pickOrEnter("video"); });
  $("hitKaraoke").addEventListener("click", function () { pickOrEnter("karaoke"); });
  $("caption").addEventListener("click", function () { enter(sel); });
  window.addEventListener("resize", fit);

  // paint the scene in the street's shared light and weather
  function paint() {
    var P = WORLD.look();
    $("stage").classList.toggle("dry", !P.wet);
    function yes() { return true; }
    svgToCanvas(skySVG(P), $("oSky"), yes, function () { texturize($("oSky"), .3, false); });
    svgToCanvas(cloudsSVG(P), $("oCloudA"), yes, function () { texturize($("oCloudA"), .45, true); try { var g = $("oCloudB").getContext("2d"); g.clearRect(0, 0, 1920, 640); g.drawImage($("oCloudA"), 0, 0); } catch (e) {} });
    svgToCanvas(buildPlateSVG(P), $("oPlate"), yes, function () { texturize($("oPlate"), .38, true, true); });
    $("oCels").innerHTML = buildCelsSVG(P);
    renderSel();
  }
  fit(); updateClock();
  setInterval(updateClock, 30000);
  $("hint").innerHTML = UI.hints([["◄ ►", "walk between doors"], ["OK", "step inside"], ["BACK", "exit"]]);
  paint();
  WORLD.refresh(paint);
  setInterval(function () { if (!entering) WORLD.refresh(paint); }, 10 * 60 * 1000);
  $("grain").style.backgroundImage = "url(" + grainTexture() + ")";
  Array.prototype.forEach.call(document.querySelectorAll(".rain.near i"), function (i) { i.style.backgroundImage = dropTile(320, 22, 26, 52, 2.2, .3, .6, 31); });
  Array.prototype.forEach.call(document.querySelectorAll(".rain.far i"), function (i) { i.style.backgroundImage = dropTile(220, 40, 12, 26, 1.4, .22, .5, 57); });
  setTimeout(function () { $("fade").classList.add("off"); }, 120);
  FSN.ackBoot("street", APP_VERSION);
})();
</script>
